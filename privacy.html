        function switchLang(lang) {
            const t = translations[lang] || translations['en'];
            document.getElementById('content').innerHTML = `
                <h1>${t.title}</h1>
                <p>${t.updated}</p>
                <p>${t.intro}</p>
                <h2>${t.sec1_t}</h2>
                <p>${t.sec1_d}</p>
                <ul>${t.sec1_l}</ul>
                <h2>${t.sec2_t}</h2>
                <p>${t.sec2_d}</p>
                <ul>${t.sec2_l}</ul>
                <h2>${t.sec3_t}</h2>
                <p>${t.sec3_d}</p>
                <h2>${t.sec5_t}</h2>
                <p>${t.sec5_d}</p>
            `;
            document.documentElement.lang = lang;
            document.getElementById('langSelect').value = lang;
        }

        // Auto-detect language from URL or Browser
        const urlParams = new URLSearchParams(window.location.search);
        let targetLang = urlParams.get('lang') || navigator.language || 'en';
        if (targetLang.startsWith('zh-HK') || targetLang.startsWith('zh-TW')) targetLang = 'zh-TW';
        else if (targetLang.startsWith('zh')) targetLang = 'zh-CN';
        else targetLang = targetLang.split('-')[0];

        switchLang(targetLang);
    </script>

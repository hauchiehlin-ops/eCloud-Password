        function switchLang(lang) {
            const t = translations[lang] || translations['en'];
            
            let faqHtml = '';
            t.faq.forEach(item => {
                faqHtml += `
                    <div class="faq-item">
                        <div class="faq-question">Q: ${item.q}</div>
                        <div class="faq-answer">A: ${item.a}</div>
                    </div>
                `;
            });

            document.getElementById('content').innerHTML = `
                <h1>${t.title}</h1>
                <p>${t.intro}</p>
                
                <h2>${t.contact_t}</h2>
                <p>${t.contact_d}</p>
                <div class="contact-info">
                    <p style="margin: 0; color: #fff; font-weight: bold;">${t.email}</p>
                </div>

                <h2>${t.faq_t}</h2>
                ${faqHtml}
            `;
            document.documentElement.lang = lang;
            document.getElementById('langSelect').value = lang;
        }

        // Auto-detect language from URL or Browser
        const urlParams = new URLSearchParams(window.location.search);
        let targetLang = urlParams.get('lang') || navigator.language || 'en';
        if (targetLang.startsWith('zh-HK') || targetLang.startsWith('zh-TW')) targetLang = 'zh-TW';
        else if (targetLang.startsWith('zh')) targetLang = 'zh-CN';
        else targetLang = targetLang.split('-')[0];

        switchLang(targetLang);
    </script>
</body>
</html>
